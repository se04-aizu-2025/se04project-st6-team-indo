{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sorting Algorithm Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container text-center mt-5">
    <h1 class="display-4 fw-bold">Sorting Algorithm</h1>
    <p class="lead text-muted mt-3">
        Sorting algorithm with visualization of the movement of the elements.
    </p>

    <div class="row mt-5 gy-4">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Bubble Sort</h5>
                    <a href="#" class="btn btn-primary btn-lg">Visualize</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Merge Sort</h5>
                    <a href="#" class="btn btn-primary btn-lg">Visualize</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Quick Sort</h5>
                    <a href="#" class="btn btn-primary btn-lg">Visualize</a>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Heap Sort</h5>
                    <a href="#" class="btn btn-primary btn-lg">Visualize</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Insert Sort</h5>
                    <a href="#" class="btn btn-primary btn-lg">Visualize</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Selection Sort</h5>
                    <a href="#" class="btn btn-primary btn-lg">Visualize</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
